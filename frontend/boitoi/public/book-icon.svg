<!-- Simple Book Icon for BoiToi -->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Book Shadow -->
  <rect x="14" y="10" width="36" height="46" rx="2" fill="#000000" opacity="0.1"/>
  
  <!-- Book Cover -->
  <rect x="12" y="8" width="36" height="46" rx="2" fill="#1e40af" stroke="#1e3a8a" stroke-width="1"/>
  
  <!-- Book Pages -->
  <rect x="14" y="10" width="32" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
  
  <!-- Book Spine -->
  <rect x="12" y="8" width="4" height="46" rx="2" fill="#1e3a8a"/>
  
  <!-- Spine Details -->
  <line x1="13" y1="16" x2="15" y2="16" stroke="#60a5fa" stroke-width="0.5"/>
  <line x1="13" y1="24" x2="15" y2="24" stroke="#60a5fa" stroke-width="0.5"/>
  <line x1="13" y1="32" x2="15" y2="32" stroke="#60a5fa" stroke-width="0.5"/>
  <line x1="13" y1="40" x2="15" y2="40" stroke="#60a5fa" stroke-width="0.5"/>
  
  <!-- Book Content Lines -->
  <rect x="18" y="16" width="24" height="1" fill="#64748b" opacity="0.6"/>
  <rect x="18" y="20" width="20" height="1" fill="#64748b" opacity="0.6"/>
  <rect x="18" y="24" width="22" height="1" fill="#64748b" opacity="0.6"/>
  <rect x="18" y="28" width="18" height="1" fill="#64748b" opacity="0.6"/>
  
  <!-- BoiToi Logo on Cover -->
  <circle cx="32" cy="36" r="8" fill="#ffffff" opacity="0.9"/>
  <text x="32" y="40" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#1e40af">BT</text>
</svg>
